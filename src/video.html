<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} | {{NAME}}</title>
<meta name="description" content="{{CATEGORY}} · {{DURATION}}. Vídeo editado por {{NAME}}.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="{{SITE_URL}}/v/{{SLUG}}">
{{PRELOAD}}
<style>{{CSS}}</style>
</head>
<body class="watch">
<main class="stage">
  <div class="poster">
    <img src="{{COVER}}" {{COVER_SRCSET}} width="360" height="640" alt="" fetchpriority="high" decoding="async">
  </div>
  <div class="shade" aria-hidden="true"></div>

  <nav class="top">
    <a class="back" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Todos os vídeos
    </a>
  </nav>

  <div class="info">
    <span class="cat">{{CATEGORY}}</span>
    <h1>{{TITLE}}</h1>
    <span class="len">{{DURATION}} · {{NAME}}</span>
    <a class="cta" href="{{WA_VIDEO}}" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 18.8z"/></svg>Quero um vídeo assim
    </a>
  </div>
</main>
</body>
</html>
