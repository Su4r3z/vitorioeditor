<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{NAME}} | {{ROLE}}</title>
<meta name="description" content="{{PITCH}}">
<meta name="theme-color" content="#0D0E12">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="{{SITE_URL}}/">
{{PRELOAD}}
<style>{{CSS}}</style>
</head>
<body>
<main class="site">
  <header class="hero">
    <h1>{{NAME}}</h1>
    <p class="role">{{ROLE}}</p>
    <p class="pitch">{{PITCH}}</p>
    <p class="chips"><span class="chip">{{COUNT}}</span></p>
  </header>

  <ul class="grid" aria-label="Vídeos">
{{CARDS}}
  </ul>

  <section class="about" aria-labelledby="sobre">
    <div class="about-head">
      <div class="avatar" aria-hidden="true">{{INITIALS}}</div>
      <h2 id="sobre">Sobre</h2>
    </div>
    <p>{{ABOUT}}</p>
    <ul class="services">
{{SERVICES}}
    </ul>
    <a class="ig" href="https://www.instagram.com/{{INSTAGRAM}}/" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>@{{INSTAGRAM}}
    </a>
  </section>

  <footer class="foot">
    <p>© {{YEAR}} {{NAME}}</p>
    <p>Este site não usa cookies e não coleta dados pessoais.</p>
  </footer>
</main>

<a class="fab" href="{{WA_HOME}}" rel="noopener">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 18.8z"/></svg>WhatsApp
</a>
</body>
</html>
